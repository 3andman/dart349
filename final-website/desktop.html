<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Windows XP - Desktop</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="xp-desktop">

    <!-- DESKTOP AREA -->
    <div class="desktop-area">

        <div class="desktop-icon">
            <img src="assets/images/my-computer.png">
            <p>My Computer</p>
        </div>

        <div class="desktop-icon">
            <img src="assets/images/recycle-bin.png">
            <p>Recycle Bin</p>
        </div>

    </div>

    <!-- TASKBAR -->
    <div class="xp-taskbar">
        <div class="start-button">Start</div>
        <div class="taskbar-right">12:00 AM</div>
    </div>

    <script src="js/error.js"></script>
    <script src="js/desktop.js"></script>

</body>

</html>
